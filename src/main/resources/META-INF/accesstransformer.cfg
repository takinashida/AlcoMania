# Exposes Entity#setSharedFlag so the client can switch the vanilla glowing
# flag (shared flag bit 6) on and off locally. Entity#setGlowingTag cannot be
# used for this: in 1.20.1 it only writes the local hasGlowingTag field, while
# isCurrentlyGlowing() on the client reads the synced shared-flags byte, so a
# client-side setGlowingTag(true) call never makes the entity render an
# outline. See VodkaSightClientHandler.
public net.minecraft.world.entity.Entity m_20115_(IZ)V # setSharedFlag
